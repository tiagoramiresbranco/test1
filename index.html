<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Playtech</title>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1.5rem;
          min-height: 100vh;
          background-color: #fff;
          color: #000;
          font-family: Arial, Helvetica, sans-serif;
          font-size: 3rem;
        }

        h1 {
          font-size: 3rem;
        }

        .input-group {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          font-size: 1rem;
        }

        .input-group input {
          padding: 0.6rem 0.8rem;
          font-size: 1rem;
          border: 1px solid #ccc;
          border-radius: 4px;
        }

        .input-group button {
          padding: 0.6rem 1rem;
          font-size: 1rem;
          border: none;
          border-radius: 4px;
          background-color: #0066ff;
          color: #fff;
          cursor: pointer;
        }

        .input-group button:hover {
          background-color: #004dd1;
        }
      </style>
    </head>
    <body>
      <h1>Playtech</h1>
      <div class="input-group">
        <input
          id="valor"
          type="number"
          inputmode="numeric"
          placeholder="Digite um número"
          aria-label="Digite um número"
        />
        <button type="button" id="submit-button">Submeter</button>
      </div>

      <script>
        const input = document.getElementById('valor');
        const button = document.getElementById('submit-button');

        button.addEventListener('click', () => {
          const valor = input.value.trim();

          if (!valor) {
            alert('Digite um número antes de submeter.');
            return;
          }

          alert(`você escreveu ${valor}`);
        });
      </script>
    </body>
  </html>
